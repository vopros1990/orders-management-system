spring:
  application:
    name: orders-api-gateway

  datasource:
    url: jdbc:h2:mem:orders_db
    driver-class-name: org.h2.Driver
    username: admin
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: create-drop

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      properties:
        retry.backoff.ms: 300
        delivery.timeout.ms: 5000
        enable.idempotence: true

server:
  port: 8082

app:

  producer:
    topic-name: "orders_new"
    partitions: 3
    replicas: 1

