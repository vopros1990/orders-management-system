spring:

  application:
    name: payment

  main:
    web-application-type: NONE

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 5
      properties:
        retry.backoff.ms: 300
        delivery.timeout.ms: 5000
        enable.idempotence: true

app:

  consumer:
    concurrency: 3
    group-id: "order_payments"
    topic-name: "orders_new"
    backoff-ms: 300
    max-retry-attempts: 5

  producer:
    topic-name: "payed_orders"
    partitions: 3
    replicas: 1

